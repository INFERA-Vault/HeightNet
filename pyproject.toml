[project]
name = "heightnet"
version = "0.1.0"
description = "Metric DSM estimation and interactive terrain analysis."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
    "h5py>=3.10",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]
remote = [
    "pystac>=1.15",
    "planetary-computer>=1.0",
    "rioxarray>=0.23",
    "pyproj>=3.7",
]
preview = [
    "pillow>=10",
]
model = [
    "torch>=2.14",
    "torchvision>=0.29",
    "transformers>=5.16",
    "accelerate>=1.14",
    "pillow>=10",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
